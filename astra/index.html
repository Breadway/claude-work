<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRA | Screening room</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="viewer-header">
  <div class="viewer-brand"><span class="brand-mark">A</span><div><strong>ASTRA</strong><span>Screening room</span></div></div>
  <div class="viewer-switches">
    <label class="film-picker">Film <select id="film" aria-label="Choose a film"><option value="astra">ASTRA: seven generations</option><option value="edu">Inside ASTRA</option></select></label>
    <label class="film-picker" id="pacing-picker" hidden>Pacing <select id="pacing" aria-label="Film pacing"><option value="narration">Narration pacing · 49:18</option><option value="original">Original pacing · 71:28</option></select></label>
  </div>
</header>
<main id="viewport" aria-label="Film viewport">
<div id="fit">
  <div id="stage">
    <canvas id="bg" width="1920" height="1080"></canvas>
    <div id="scenes"></div>
    <div id="sweep"></div>
    <div id="hud"></div>
    <div id="caps"></div>
    <div id="fx"></div>
    <div id="prog"></div>
    <canvas id="grain" width="320" height="180"></canvas>
  </div>
</div>
</main>
<div id="ui">
  <div class="timeline-row"><input id="scrub" aria-label="Film position" type="range" min="0" max="1000" step="0.01" value="0"><span id="time">0:00 / 0:00</span></div>
  <div class="transport-row">
    <button id="play" class="primary" disabled>Play</button>
    <button id="restart" title="Restart film" aria-label="Restart film">Restart</button>
    <select id="chapter" aria-label="Jump to a chapter"><option>Chapters</option></select>
    <label class="fps-control">Playback <select id="fps" aria-label="Playback frame rate"><option value="60">60 fps</option><option value="30">30 fps</option></select></label>
    <label class="volume-control">Volume <input id="volume" aria-label="Volume" type="range" min="0" max="1" step="0.01" value="0.85"></label>
    <button id="captions" aria-pressed="true" title="Toggle captions">Captions</button>
    <button id="fullscreen" title="Fullscreen (F)">Fullscreen</button>
  </div>
  <div class="viewer-info"><span id="status" role="status" aria-live="polite">Loading film…</span><span class="shortcuts">Space to play · Arrows to step · Shift + arrows to skip 5s</span></div>
</div>
<audio id="audio" preload="metadata"></audio>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".5"/></filter>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14203a"/><stop offset="1" stop-color="#0c1526"/></linearGradient>
    <linearGradient id="surface-on" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2c4a"/><stop offset="1" stop-color="#101b30"/></linearGradient>
    <linearGradient id="gcp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7be3d5"/><stop offset="1" stop-color="#b6a1ff"/></linearGradient>
    <linearGradient id="gpg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b6a1ff"/><stop offset="1" stop-color="#f2c67b"/></linearGradient>
    <linearGradient id="gred" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a8a"/><stop offset="1" stop-color="#f2c67b"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8aa8"/></marker>
  </defs>
</svg>
<script type="module" src="main.js"></script>
</body>
</html>
